<!--
  The sign-in email.

  `{{ .Token }}` is what makes this a code rather than a link: Supabase decides
  which it sends from what the template asks for, so a template without the
  token silently goes back to being a magic link and nothing says so until a
  real email arrives (NONET-21).

  The link is deliberately absent. Offering both would reintroduce the failure
  the code exists to remove — a player on their phone taps the link, it opens in
  the mail app's own browser, and they are signed in somewhere they were not
  playing.

  Plain and quiet, per DESIGN.md. No emoji, no exclamation marks.
-->
<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; line-height: 1.6; color: #16181B; max-width: 32em;">
  <p style="font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: #5A5F65; margin: 0 0 24px;">
    Nonet
  </p>

  <p style="font-size: 15px; margin: 0 0 24px;">
    Here is your sign-in code. Enter it in the tab you started in.
  </p>

  <p style="font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 32px; letter-spacing: 0.3em; font-weight: 600; margin: 0 0 24px;">
    {{ .Token }}
  </p>

  <p style="font-size: 13px; color: #5A5F65; margin: 0;">
    It expires in fifteen minutes. If you did not ask for it, you can ignore this
    email — nothing has changed.
  </p>
</div>
