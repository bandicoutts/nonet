# The two suites that exist, on every push to main and every PR against it.
#
# Nothing else: no lint, no typecheck job, no coverage, no deploy. The unit
# suite and the e2e suite are what the repo has, and running only what exists
# keeps a red tick meaning "a test broke" rather than "something in CI moved".
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # One job, not two. The install and the pnpm store fetch are the fixed cost;
    # splitting the suites would pay it twice to run an 8-second unit suite in
    # parallel with a 90-second e2e one.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # No `version:` — the action reads `packageManager` from package.json,
      # which is where 9.15.9 is already pinned. One source, so CI cannot drift
      # from what a developer runs. pnpm 11 needs Node 22 and this repo is on
      # 20, so the pin is load-bearing rather than tidiness.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # The floor in `engines`, exactly. Not `20.x`: the point is that CI
          # runs what the repo runs.
          node-version: 20.18.0
          # Caches the pnpm store, keyed on the lockfile. Must come after the
          # pnpm setup above, or there is no pnpm for it to ask.
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The browsers are the slow part of a cold run — far slower than the
      # install — so they are cached on the resolved Playwright version. Read
      # from the installed package rather than the lockfile, because that is the
      # version that will actually launch.
      - name: Resolve Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('./apps/web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Chromium for the desktop project, WebKit for the mobile one — the
      # iPhone 13 device descriptor is WebKit, so Chromium alone would fail
      # half the matrix.
      - name: Install browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @nonet/web exec playwright install --with-deps chromium webkit

      # EXPERIMENT: does a cache hit need install-deps at all?

      - name: Unit tests
        run: pnpm test

      # The production build happens inside this step: `playwright.config.ts`
      # declares a `webServer` of `pnpm build && pnpm start`, and `CI` is set
      # here so it starts a fresh server rather than reusing one. A separate
      # build step would build the app twice.
      #
      # `pnpm e2e` is not a root script — it lives in apps/web — so this calls
      # the script that exists rather than inventing one.
      - name: End-to-end tests
        run: pnpm --filter @nonet/web e2e

      - uses: actions/upload-artifact@v4
        # Only when something failed: the config keeps a trace and a screenshot
        # on failure, and they are the whole reason a red run is diagnosable
        # without re-running it locally.
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7
